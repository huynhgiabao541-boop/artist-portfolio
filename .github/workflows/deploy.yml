name: Deploy Portfolio (Cloud Run + Firebase Hosting)

on:
  push:
    branches:
      - main

env:
  PROJECT_ID: npgk-portfolio-art
  REGION: asia-southeast1
  SERVICE_NAME: portfolio-media-service

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Deploy Backend to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          source: ./portfolio-server
          flags: >-
            --allow-unauthenticated
            --memory=512Mi
            --set-env-vars=ADMIN_UID=${{ secrets.ADMIN_UID }},S3_ENDPOINT=${{ secrets.S3_ENDPOINT }},S3_REGION=${{ secrets.S3_REGION }},S3_BUCKET_NAME=${{ secrets.S3_BUCKET_NAME }},S3_ACCESS_KEY=${{ secrets.S3_ACCESS_KEY }},S3_SECRET_KEY=${{ secrets.S3_SECRET_KEY }},S3_PUBLIC_URL=${{ secrets.S3_PUBLIC_URL }},ALLOWED_ORIGIN=${{ secrets.ALLOWED_ORIGIN }}
            --set-secrets=FIREBASE_SERVICE_ACCOUNT=FIREBASE_SERVICE_ACCOUNT:latest

  deploy-frontend:
    needs: deploy-backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: artist-portfolio/package-lock.json

      - name: Install & Build Frontend
        working-directory: ./artist-portfolio
        run: |
          npm ci
          npm run build

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEPLOY }}
          channelId: live
          projectId: ${{ env.PROJECT_ID }}

